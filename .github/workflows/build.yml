#
# Builds the UWP app and Mesa's spirv_to_dxil.dll, and optionally packs and signs the appx the
# same way tools/xbox/package-appx.ps1 -Library does on a PC. Called by ci.yml and release.yml.

name: Build

on:
  workflow_call:
    inputs:
      package:
        description: Also make the appx package
        type: boolean
        default: false
      temporary_signing:
        description: Sign a manual test package with an ephemeral self-signed certificate
        type: boolean
        default: false
      package_version:
        description: Package version for a release (MAJOR.MINOR.BUILD.REVISION); empty keeps the manifest's
        type: string
        default: ""
      lto:
        description: Link-time optimize the emulator's libraries (JADYX_HOST_LTO), as releases ship
        type: boolean
        default: false
    secrets:
      JADYX_PFX_BASE64:
        required: false
      JADYX_PFX_PASSWORD:
        required: false
      SCCACHE_R2_ACCOUNT_ID:
        required: false
      SCCACHE_R2_ACCESS_KEY_ID:
        required: false
      SCCACHE_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  mesa:
    name: spirv_to_dxil
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The DLL only depends on the Mesa version and our patches, all of which live in these files.
      - name: Restore the built DLL
        id: cache
        uses: actions/cache@v6
        with:
          path: mesa-out
          key: spirv-to-dxil-${{ hashFiles('tools/xbox/build-spirv-to-dxil.ps1', 'tools/xbox/mesa/**', 'externals/spirv-to-dxil/include/**') }}

      - name: Build spirv_to_dxil.dll
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mesa-build"
          & tools\xbox\build-spirv-to-dxil.ps1 -WorkDir $work
          New-Item -ItemType Directory -Force mesa-out | Out-Null
          Copy-Item (Join-Path $work "build-uwp\src\microsoft\spirv_to_dxil\spirv_to_dxil.dll") mesa-out

      - uses: actions/upload-artifact@v7
        with:
          name: spirv-to-dxil
          path: mesa-out/spirv_to_dxil.dll
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: jadyx (UWP x64)
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      # Without the R2 bucket, sccache keeps its objects in one directory, saved as a single cache
      # archive.
      SCCACHE_DIR: ${{ github.workspace }}\.cache\sccache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - uses: actions/checkout@v7

      # build-env.bat picks these up from C:\glslang\bin and C:\Program Files\NASM, as on a PC.
      # With jom on the PATH openssl-cmake builds OpenSSL on every core; without it, it falls back
      # to a single-threaded nmake (8 minutes on the runner).
      - name: Host tools (glslang, NASM, jom)
        id: tools
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "glslang.zip"
          Invoke-WebRequest "https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "82BF434E69B9BB4829DE7E2B4BC2C5E7A7861E53D66CF75E5CC70F5F694A8D9B") {
              throw "glslang checksum mismatch"
          }
          Expand-Archive $zip C:\glslang -Force
          Copy-Item C:\glslang\bin\glslang.exe C:\glslang\bin\glslangValidator.exe
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { choco install nasm -y --no-progress }
          if (-not (Get-Command jom -ErrorAction SilentlyContinue)) { choco install jom -y --no-progress }
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl is missing from the runner" }
          # The runner image pins the compiler: objects built by another one are not reused.
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore CPM sources
        id: cpm
        uses: actions/cache/restore@v6
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}

      # GitHub's cache is scoped: what a pull request saves is seen by that PR alone, so every new
      # PR started from main's last save. One Cloudflare R2 bucket is shared by every PR, main and
      # Release, like the compiler cache of a PC. Without its secrets (a fork's PR) the build falls
      # back to GitHub's cache. The bucket expires objects after 14 days.
      - name: Compiler cache backend
        id: backend
        shell: powershell
        env:
          R2_ACCOUNT: ${{ secrets.SCCACHE_R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          if ($env:R2_ACCOUNT -and $env:R2_KEY -and $env:R2_SECRET) {
              @(
                  "SCCACHE_BUCKET=jadyx-sccache"
                  "SCCACHE_ENDPOINT=https://$env:R2_ACCOUNT.r2.cloudflarestorage.com"
                  "SCCACHE_REGION=auto"
                  "SCCACHE_S3_KEY_PREFIX=uwp-x64"
                  "AWS_ACCESS_KEY_ID=$env:R2_KEY"
                  "AWS_SECRET_ACCESS_KEY=$env:R2_SECRET"
              ) | Add-Content $env:GITHUB_ENV
              "remote=true" >> $env:GITHUB_OUTPUT
              "Compiler cache: R2 bucket jadyx-sccache"
          } else {
              "Compiler cache: GitHub Actions cache (no R2 secrets)"
          }

      - name: Restore compiler cache
        if: steps.backend.outputs.remote != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/sccache
          key: sccache-uwp-${{ github.run_id }}
          restore-keys: sccache-uwp-

      # OpenSSL builds through its own makefile. USE_CCACHE (Configure) puts sccache in front of its
      # compiler as well, so its objects are shared across pull requests too; keeping the build tree
      # (configure results, objects, libs) also skips the Perl configure and lets jom find the
      # libraries up to date. Anything that can change its sources or flags changes the key.
      - name: Restore OpenSSL build
        id: openssl
        uses: actions/cache/restore@v6
        with:
          path: build-uwp/_deps/openssl-build
          key: openssl-uwp-sccache-${{ steps.tools.outputs.image }}-${{ hashFiles('cpmfile.json', 'CMakePresets.json', 'CMakeLists.txt', 'CMakeModules/**') }}

      # Its post step read the stats after "Compiler cache stats" had stopped the server, so its
      # annotation always said 0 hits. That step writes the real ones to the run summary instead.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true

      # USE_CCACHE (externals/cmake-modules/UseCcache.cmake) makes sccache the compiler launcher, and
      # openssl-cmake writes it into OpenSSL's makefile. CCACHE_BINARY stays a bare name, found on the
      # PATH: the makefile runs its dependency scans through cmd, which rejects the C:/... path that
      # find_program would give. sccache cannot share a /Zi program database between parallel
      # compilers: embed the debug info (/Z7) instead, which UseCcache does only for Debug and
      # RelWithDebInfo. The link still writes jadyx.pdb.
      - name: Configure
        shell: cmd
        run: >
          tools\xbox\build-env.bat cmake --preset uwp-x64
          -DUSE_CCACHE=ON -DCCACHE_BINARY=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DJADYX_HOST_LTO=${{ inputs.lto && 'ON' || 'OFF' }}

      - name: Build
        shell: cmd
        run: tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target jadyx

      - name: Test updater policy, HTTP and recovery
        shell: pwsh
        run: tools/xbox/tests/run-updater-gates.ps1

      - name: Compiler cache stats
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $stats = sccache --show-stats
          $stats
          sccache --stop-server
          $fence = '```'
          "### sccache`n$fence`n$($stats -join "`n")`n$fence" >> $env:GITHUB_STEP_SUMMARY

      # Every run saves what it built. A PR's GitHub caches are visible to that PR alone, so its
      # next push starts warm; main's (Release and manual runs) seed every new PR. The repo keeps
      # 10 GB and evicts the least recently used first, and every PR reads main's, so they stay.
      - name: Save CPM sources
        if: always() && steps.cpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/cpm
          key: ${{ steps.cpm.outputs.cache-primary-key }}

      - name: Save OpenSSL build
        if: always() && steps.openssl.outputs.cache-hit != 'true' && hashFiles('build-uwp/_deps/openssl-build/libcrypto.lib') != ''
        uses: actions/cache/save@v6
        with:
          path: build-uwp/_deps/openssl-build
          key: ${{ steps.openssl.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: always() && steps.backend.outputs.remote != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/sccache
          key: sccache-uwp-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: jadyx-build
          retention-days: 7
          if-no-files-found: error
          path: |
            build-uwp/bin/jadyx.exe
            build-uwp/bin/jadyx.pdb
            build-uwp/bin/*.dll

  package:
    name: appx
    if: inputs.package
    needs: [mesa, emulator]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jadyx-build
          path: build-uwp/bin

      - uses: actions/download-artifact@v8
        with:
          name: spirv-to-dxil
          path: ${{ runner.temp }}/mesa

      - name: Pack and sign
        shell: powershell
        env:
          JADYX_PFX_BASE64: ${{ secrets.JADYX_PFX_BASE64 }}
          JADYX_PFX_PASSWORD: ${{ secrets.JADYX_PFX_PASSWORD }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          TEMPORARY_SIGNING: ${{ inputs.temporary_signing }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "jadyx.pfx"
          $certThumbprint = $null
          try {
              if ($env:TEMPORARY_SIGNING -eq "true") {
                  $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=JadyxDev" `
                      -FriendlyName "Jadyx temporary CI signer" -CertStoreLocation Cert:\CurrentUser\My `
                      -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(30)
                  $certThumbprint = $cert.Thumbprint
                  $password = [Guid]::NewGuid().ToString("N") + [Guid]::NewGuid().ToString("N")
                  $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
                  $exportParams = @{ Cert = $cert; FilePath = $pfx; Password = $securePassword }
                  Export-PfxCertificate @exportParams | Out-Null
                  $env:JADYX_PFX_PASSWORD = $password
                  Write-Host "::notice::Using a temporary self-signed certificate. This package cannot update installs signed by the project certificate."
              } else {
                  if (-not $env:JADYX_PFX_BASE64 -or -not $env:JADYX_PFX_PASSWORD) {
                      throw "The JADYX_PFX_BASE64 / JADYX_PFX_PASSWORD secrets are not set; enable temporary_signing only for a test package."
                  }
                  # A secret piped in from PowerShell can carry a BOM or line breaks; keep only base64.
                  $base64 = $env:JADYX_PFX_BASE64 -replace '[^A-Za-z0-9+/=]', ''
                  [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
              }

              $params = @{
                  Release     = $true
                  PfxPath     = $pfx
                  SpirvToDxil = Join-Path $env:RUNNER_TEMP "mesa\spirv_to_dxil.dll"
              }
              if ($env:PACKAGE_VERSION) { $params.Version = $env:PACKAGE_VERSION }
              & tools\xbox\package-appx.ps1 @params

              [xml]$mf = Get-Content build-uwp\package\layout\AppxManifest.xml -Raw
              $version = $mf.Package.Identity.Version
              $out = New-Item -ItemType Directory -Force out
              Copy-Item build-uwp\package\jadyx.appx "out\Jadyx_${version}_x64.appx"
              Copy-Item build-uwp\package\jadyx.cer out\Jadyx.cer
              Copy-Item build-uwp\package\Microsoft.VCLibs.x64.14.00.appx out\
              Compress-Archive build-uwp\bin\jadyx.pdb "out\Jadyx_${version}_symbols.zip"
              $signing = if ($certThumbprint) { "temporary-self-signed" } else { "project" }
              [ordered]@{
                  version        = $version
                  commit         = $env:GITHUB_SHA
                  run            = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                  signing        = $signing
                  signerThumbprint  = if ($certThumbprint) { $certThumbprint } else { $null }
              } | ConvertTo-Json | Set-Content -Encoding ascii out\build-info.json
              Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
                  "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
              } | Set-Content -Encoding ascii out\SHA256SUMS.txt
              Get-ChildItem out | Format-Table Name, Length
          } finally {
              if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
              if ($certThumbprint) {
                  Remove-Item "Cert:\CurrentUser\My\$certThumbprint" -Force -ErrorAction SilentlyContinue
              }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.temporary_signing && 'jadyx-package-temporary-signing' || 'jadyx-package' }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
