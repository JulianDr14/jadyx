#
# Publishes a release: Actions -> Release -> Run workflow (on main) with a version like 0.3.0.
# It requires the committed version, builds/signs the appx and metadata, then creates a draft
# at that exact commit before publishing. It never creates commits or overwrites release assets.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, MAJOR.MINOR.BUILD.REVISION (e.g. 0.3.6.0)
        required: true
        type: string
      highlights:
        description: Optional text shown above the changelog
        required: false
        type: string
      prerelease:
        description: Mark as a pre-release (not shown as Latest)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; a release never cancels another.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.check.outputs.package_version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main' || github.repository != 'JulianDr14/jadyx'
        run: |
          echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}"
          exit 1

      - uses: actions/checkout@v7

      - run: python3 tools/xbox/tests/release.py

      - name: Check the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 tools/xbox/release.py version "$VERSION" --manifest dist/uwp/AppxManifest.xml \
              --releases "$RUNNER_TEMP/releases.json" --match-manifest \
              --issue-template .github/ISSUE_TEMPLATE/bug_report.yml | tee -a "$GITHUB_OUTPUT"
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag already exists"
              exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      package: true
      package_version: ${{ needs.version.outputs.package_version }}
      lto: true
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      HIGHLIGHTS: ${{ inputs.highlights }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The commit that was built, with full history and tags for the changelog.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jadyx-package
          path: out

      - name: Sign update metadata
        shell: pwsh
        env:
          JADYX_PFX_BASE64: ${{ secrets.JADYX_PFX_BASE64 }}
          JADYX_PFX_PASSWORD: ${{ secrets.JADYX_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "update-signing.pfx"
          try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:JADYX_PFX_BASE64))
              $channel = if ($env:PRERELEASE -eq 'true') { 'preview' } else { 'stable' }
              & tools/xbox/create-update.ps1 -Package "out/Jadyx_$($env:PACKAGE_VERSION)_x64.appx" -OutputDirectory out -Channel $channel -Notes $env:HIGHLIGHTS -PfxPath $pfx
          } finally { if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force } }

      - name: Include update metadata in checksums
        run: |
          (cd out && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum) > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" out/SHA256SUMS.txt

      - name: Record release source
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          # The version is already committed and matches the build. Never create bot-authored commits.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Write the release notes
        run: |
          {
              if [ -n "$HIGHLIGHTS" ]; then printf '%s\n\n' "$HIGHLIGHTS"; fi
              python3 tools/xbox/release.py notes --tag "$TAG" --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY"
              cat <<EOF

          ## Install

          You need an Xbox Series X|S in Dev Mode. No keys, firmware or games are included: use your
          own dumps.

          1. Download \`Jadyx_${PACKAGE_VERSION}_x64.appx\` and \`Microsoft.VCLibs.x64.14.00.appx\`
             from the assets below. Since Jadyx 0.3.9.0, no separate .cer upload is required.
          2. On a PC on the same network, open Device Portal at \`https://<xbox-ip>:11443\` (Dev Home
             shows the address) and accept the browser's certificate warning.
          3. Choose **Add**, pick the Jadyx appx, add the VCLibs appx as a dependency if a compatible
             version is not already installed, and install.
          4. In Dev Home, select Jadyx → **View details** and set **App type** to **Game**. In App mode
             it runs out of memory.
          5. Start Jadyx and send your keys, firmware and games from a PC or phone with the
             **Jadyx Portal**: **Settings → File manager → Network connection → Start server**, open
             the address it shows in a browser on the same network and enter the connection code.
          6. Other ways: import keys and firmware from a folder or ZIP on a USB drive in
             **Settings → File manager**, and add games from an external folder or USB drive, or copy
             them to the app's \`LocalState\games\` folder with the Device Portal file explorer.

          A newer version installs over the previous one and keeps your games, saves and settings. Do
          not uninstall to update: uninstalling deletes them.

          ## Reporting bugs

          Open an issue at https://github.com/${GITHUB_REPOSITORY}/issues/new/choose with the **Bug
          Report** form. A good report has:

          - The Jadyx version (\`${TAG#v}\`) and whether it is a Series X or S, in Game mode.
          - What you did, what you expected and what happened instead, with the steps to make it
            happen again.
          - The logs from the app's \`LocalState\jadyx\log\` folder (Device Portal → **File
            explorer**): \`jadyx_log.txt\`, \`jadyx_diag.txt\` and, for graphics problems,
            \`jadyx_graphics_bugs.log\`. Grab them right after the problem, before launching another
            game.

          Search the existing issues first. Reports about pirated keys, firmware or games are closed.
          If the bug also happens in the desktop builds of Eden, report it to Eden instead.

          Questions, install help and compatibility reports: join the
          [Discord](https://discord.gg/3BhyyXGxpd).
          EOF
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        run: |
          version="${TAG#v}"
          title="Jadyx $version"
          if [ "${version%%.*}" = "0" ]; then title="$title Beta"; fi
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          draft_flags=()
          if [ "$PRERELEASE" = "true" ]; then draft_flags=(--prerelease); fi
          gh release create "$TAG" out/* --repo JulianDr14/jadyx --verify-tag --draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
              "${draft_flags[@]}"
          test "$(gh api 'repos/JulianDr14/jadyx/git/ref/tags/'"$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/update-verify"
          gh release download "$TAG" --repo JulianDr14/jadyx -p update.json -p update.sig -p "Jadyx_${PACKAGE_VERSION}_x64.appx" --dir "$RUNNER_TEMP/update-verify"
          for file in update.json update.sig "Jadyx_${PACKAGE_VERSION}_x64.appx"; do
              cmp "out/$file" "$RUNNER_TEMP/update-verify/$file"
          done
          gh release edit "$TAG" --repo JulianDr14/jadyx --draft=false "${flags[@]}"
          echo "TITLE=$title" >> "$GITHUB_ENV"

      # The release is already out, so a Discord failure only warns. Pings Release Ping only for
      # full releases, not pre-releases.
      # Disabled: releases are announced on Discord by hand. Remove `if: false` to re-enable.
      - name: Announce on Discord
        if: false
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          DISCORD_ROLE: ${{ vars.DISCORD_RELEASE_ROLE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_RELEASES_WEBHOOK secret; skipping"; exit 0; fi
          python3 - > "$RUNNER_TEMP/discord.json" <<'PY'
          import json, os
          env = os.environ
          url = f"https://github.com/{env['GITHUB_REPOSITORY']}/releases/tag/{env['TAG']}"
          ping = env.get("DISCORD_ROLE") if env["PRERELEASE"] != "true" else ""
          text = env.get("HIGHLIGHTS") or "A new build is out."
          print(json.dumps({
              "content": f"<@&{ping}>" if ping else "",
              "allowed_mentions": {"roles": [ping] if ping else []},
              "embeds": [{
                  "title": env["TITLE"] + (" (pre-release)" if env["PRERELEASE"] == "true" else ""),
                  "url": url,
                  "description": text[:3500] + f"\n\n**Download and install:** {url}",
                  "color": 0x0078D4,
              }],
          }))
          PY
          curl -fsS -H "Content-Type: application/json" --data @"$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK"
