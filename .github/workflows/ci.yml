#
# Every pull request must build. A merge to main does not build again: the PR already built the
# merged result (pull_request checks out the merge commit), and Release builds main itself. Run it
# by hand (Actions -> CI -> Run workflow, on any branch) to also get a signed test appx as a 14-day
# artifact.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      package:
        description: Also make a signed test appx
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: release and packaging scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/xbox/tests/release.py
      - run: python3 -B tools/xbox/tests/package-launch.py

  build:
    uses: ./.github/workflows/build.yml
    with:
      package: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    secrets: inherit
