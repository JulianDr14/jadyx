name: Bug Report
description: Something in Jadyx does not work as it should
body:
  - type: markdown
    attributes:
      value: |
        Read the [contributing guide](https://github.com/JulianDr14/jadyx/blob/main/CONTRIBUTING.md) first. Reports about pirated keys, firmware or games are closed without an answer. If the bug also happens in the desktop builds of Eden, report it to Eden instead.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      options:
      - label: I have searched the existing issues
        required: true
  - type: input
    attributes:
      label: Jadyx version
      description: Shown in the corner of the game library.
      placeholder: v0.3.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Where did it happen?
      options:
        - Xbox Series X
        - Xbox Series S
        - PC
    validations:
      required: true
  - type: dropdown
    attributes:
      label: App mode on the console
      options:
        - Game
        - App
        - Not on a console
    validations:
      required: true
  - type: textarea
    id: issue-desc
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. You may describe the game by its kind instead of naming it.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostics
      description: Attach `jadyx_log.txt`, `jadyx_diag.txt` and, for graphics problems, `jadyx_graphics_bugs.log`, taken right after the problem, from the package's `LocalState\jadyx\log` folder (Device Portal file explorer on the console, `%LOCALAPPDATA%\Packages\<package family>\LocalState\jadyx\log` on PC).
    validations:
      required: true
